<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>百人一首 異世界言霊バトル - 雅</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="audio-bgm" src="bgm/bgm.mp3" loop preload="auto"></audio>

<div class="game-container" onclick="tryResumeAudio()">
  <div class="header-bar">
    <h1>百人一首 異世界言霊バトル</h1>
    <button class="bgm-btn" id="bgm-toggle-btn" onclick="toggleBgm(event)">🎵 BGM: 停止中</button>
  </div>

  <!-- 音量バランス調整エリア -->
  <div class="volume-controls">
    <div class="volume-slider-wrap">
      <label for="bgm-vol-slider">BGM音量:</label>
      <input type="range" id="bgm-vol-slider" min="0" max="100" value="25" oninput="changeBgmVolume(this.value)">
      <span id="bgm-vol-txt">25%</span>
    </div>
    <div class="volume-slider-wrap">
      <label for="se-vol-slider">効果音(SE):</label>
      <input type="range" id="se-vol-slider" min="0" max="100" value="80" oninput="changeSeVolume(this.value)">
      <span id="se-vol-txt">80%</span>
    </div>
  </div>

  <div class="battlefield">
    <div class="entity-box">
      <div class="entity-name">綾瀬 詩乃</div>
      <div class="hp-bar-bg"><div id="player-hp-bar" class="hp-bar-fill" style="width: 100%; background: #10b981;"></div></div>
      <div class="hp-num" id="player-hp-txt">HP: 100 / 100</div>
      <div id="player-status" class="status-txt"></div>
    </div>
    <div class="entity-box">
      <div class="entity-name" id="boss-name">敵魔獣</div>
      <div class="hp-bar-bg"><div id="boss-hp-bar" class="hp-bar-fill" style="width: 100%;"></div></div>
      <div class="hp-num" id="boss-hp-txt">HP: 0 / 0</div>
      <div id="boss-status" class="status-txt"></div>
    </div>
  </div>

  <div class="bozu-section">
    <div class="bozu-header">
      <div>重ねた札: <span id="stack-count">0</span> 枚</div>
      <div>現在の言霊倍率: <span id="multiplier" class="multiplier">1.0x</span></div>
    </div>
    
    <div class="deck-stats">
      <span>山札残: <strong id="deck-total" style="color:#fde047;">100</strong>枚</span>
      <span>殿: <span id="deck-tono">66</span></span>
      <span>姫: <span id="deck-hime">21</span></span>
      <span>坊主: <strong id="deck-bozu" style="color:#f87171;">13</strong></span>
    </div>
    
    <div class="drawn-card-display" id="drawn-card">
      <div class="card-type-tag tag-tono" id="card-tag">山札</div>
      <div class="card-svg-wrap" id="card-art-container"></div>
      <div>
        <div class="card-name-txt" id="card-name">未ドロー</div>
        <div class="card-bonus-txt" id="card-bonus">めくって倍率UP</div>
      </div>
    </div>

    <button id="draw-btn" class="card-draw-btn" onclick="handleManualDraw()">札をめくる (1枚目:行動フリー)</button>
  </div>

  <div class="hand-header">
    <span>詠唱可能な歌（田の字・4首）:</span>
    <span>行動で手札再配布</span>
  </div>

  <div class="skills-section" id="hand-container"></div>

  <button class="restart-btn" id="restart-btn" onclick="startNewBattle()">次の敵と対峙する (再戦)</button>

  <div class="log-box" id="log-box"></div>
</div>

<script src="game.js"></script>
</body>
</html>
